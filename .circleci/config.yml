version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            echo "step started"
            python --version
            python -m venv venv
            echo "venv created"
            . venv/bin/activate
            echo "venv activated"
            pip install -r requirements-dev.txt
            echo "install done"
      - run:
          name: Run tests
          command: |
            . venv/bin/activate
            mkdir -p test-results
            pytest

workflows:
  build-test:
    jobs:
      - build-and-test
